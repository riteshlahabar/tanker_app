name: tanker_app
description: "Water tanker delivery — one app for the owner, drivers and customers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # DESIGN — the appetit source is built on these two, so its markup is lifted
  # verbatim rather than retyped. nb_utils supplies the colours, text styles
  # and spacing extensions every appetit widget uses.
  nb_utils: ^7.0.4
  google_fonts: ^6.2.1

  # STATE MANAGEMENT — Riverpod, not appetit's MobX (owner's call).
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # NETWORK + STORAGE
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1

  intl: ^0.19.0

  # LOCATION — driver's Spots tab asks the panel for the nearest refill spot,
  # which needs the device's own position.
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

  # Generates the Android/iOS launcher icons from assets/images/tsml_favicon.png
  # — a one-shot dev tool, run via `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/tsml_logo.png
    - assets/images/tsml_favicon.png

# Config for flutter_launcher_icons (dart run flutter_launcher_icons).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/tsml_favicon.png"
  # The source has transparent rounded corners; Apple rejects an alpha
  # channel on iOS icons, so flatten it onto a white background there.
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
