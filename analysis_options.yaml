# Analysis options for tanker_app.
#
# flutter_lints is the base; the changes below follow the project's engineering
# rules rather than taste.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Dependencies are injected as named parameters onto private fields
    # (`required ApiClient client`) because Dart forbids a named parameter
    # beginning with an underscore, so an initializing formal is not available.
    # The lint fires on every repository and provider in the codebase.
    prefer_initializing_formals: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # SOLID: a widget or provider depends on an interface, so constructors
    # stay const-able and cheap to fake in a test.
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_final_locals: true

    # One widget per file and small files are project rules; these keep the
    # habits that go with them.
    always_declare_return_types: true
    avoid_print: true
    prefer_single_quotes: true
    require_trailing_commas: true
    unawaited_futures: true
    use_super_parameters: true
